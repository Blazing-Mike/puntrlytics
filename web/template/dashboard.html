<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Bet Analyzer — Dashboard</title>
    <style>
      /* Geist Mono — same asset the report uses; served from dist root. */
      @font-face {
        font-family: "Geist Mono";
        src: url("./GeistMono-VariableFont_wght.ttf") format("truetype");
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "Geist Mono";
        src: url("./GeistMono-Italic-VariableFont_wght.ttf") format("truetype");
        font-weight: 100 900;
        font-style: italic;
        font-display: swap;
      }
      :root {
        --bg: #0b0f17;
        --panel: #111827;
        --panel2: #0d1320;
        --rule: #374153;
        --rule-soft: rgba(55, 65, 83, 0.55);
        --ink: #f2eee4;
        --faint: #9aa4b6;
        --gold: #f7b955;
        --lime: #41d484;
        --rose: #ff7084;
        --cyan: #5fd4ff;
        --mono: "Geist Mono", "Courier New", monospace;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background:
          radial-gradient(circle at 12% 0, #223047 0 20%, transparent 42%),
          linear-gradient(135deg, #0a0d12, #171922 55%, #0e1219);
        color: var(--ink);
        font:
          14px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      .ba-shell {
        display: flex;
        height: 100vh;
      }
      .ba-side {
        width: 300px;
        min-width: 300px;
        border-right: 1px solid var(--rule);
        background: linear-gradient(180deg, var(--panel), var(--panel2));
        display: flex;
        flex-direction: column;
      }
      .ba-head {
        padding: 18px 18px 14px;
        border-bottom: 1px solid var(--rule-soft);
      }
      .ba-head-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .ba-home {
        font: 700 10px/1.6 var(--mono);
        text-transform: uppercase;
        letter-spacing: 1.2px;
        color: var(--gold);
        text-decoration: none;
        white-space: nowrap;
      }
      .ba-home:hover {
        text-decoration: underline;
      }
      .ba-home:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 2px;
      }
      .ba-head h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 0.5px;
      }
      .ba-head h1 span {
        color: var(--gold);
      }
      .ba-head p {
        margin: 4px 0 0;
        font: 700 10px/1.6 var(--mono);
        text-transform: uppercase;
        letter-spacing: 1.4px;
        color: var(--faint);
      }

      .ba-stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        padding: 14px 18px;
        border-bottom: 1px solid var(--rule-soft);
      }
      .ba-stat {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--rule-soft);
        border-radius: 10px;
        padding: 8px 10px;
        min-width: 0;
      }
      .ba-stat-label {
        font: 700 9px/1.4 var(--mono);
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--faint);
      }
      .ba-stat-value {
        font-family: var(--mono);
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .ba-list {
        flex: 1;
        overflow-y: auto;
        padding: 10px 10px 12px;
      }
      .ba-list-title {
        font: 700 10px/1.6 var(--mono);
        text-transform: uppercase;
        letter-spacing: 1.4px;
        color: var(--faint);
        padding: 2px 12px 8px;
      }
      .ba-row {
        position: relative;
        margin-bottom: 6px;
      }
      .ba-row-btn {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        gap: 0 10px;
        width: 100%;
        text-align: left;
        background: transparent;
        border: 1px solid transparent;
        border-radius: 10px;
        padding: 10px 12px;
        cursor: pointer;
        color: var(--ink);
        transition:
          background 0.12s ease,
          border-color 0.12s ease;
      }
      .ba-row-btn:hover {
        background: rgba(255, 255, 255, 0.04);
        border-color: var(--rule-soft);
      }
      .ba-row.ba-active .ba-row-btn {
        border-color: var(--gold);
        background: rgba(247, 185, 85, 0.08);
      }
      .ba-avatar {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--mono);
        font-weight: 800;
        font-size: 14px;
        text-transform: uppercase;
        color: #07090e;
      }
      .ba-row-meta {
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .ba-row-prov {
        font-weight: 700;
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .ba-row-date {
        font-size: 11px;
        color: var(--faint);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .ba-row-nums {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
      }
      .ba-row-profit {
        font-family: var(--mono);
        font-weight: 700;
        font-size: 13px;
        white-space: nowrap;
      }
      .ba-row-roi {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--faint);
        white-space: nowrap;
      }
      .ba-row-del {
        position: absolute;
        top: 6px;
        right: 6px;
        width: 20px;
        height: 20px;
        border: 0;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.08);
        color: var(--faint);
        font-size: 14px;
        line-height: 1;
        cursor: pointer;
        opacity: 0;
        transition:
          opacity 0.12s ease,
          background 0.12s ease,
          color 0.12s ease;
      }
      .ba-row:hover .ba-row-del,
      .ba-row-del:focus-visible {
        opacity: 1;
      }
      .ba-row-del:hover {
        background: var(--rose);
        color: #fff;
      }
      .ba-pos {
        color: var(--lime);
      }
      .ba-neg {
        color: var(--rose);
      }
      .ba-empty {
        color: var(--faint);
        font-size: 13px;
        line-height: 1.7;
        padding: 24px 12px;
        text-align: center;
      }
      .ba-empty-mark {
        font-size: 30px;
        line-height: 1;
        color: var(--rule);
        margin-bottom: 10px;
      }
      .ba-foot {
        padding: 12px 18px;
        border-top: 1px solid var(--rule-soft);
        font: 700 9.5px/1.6 var(--mono);
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--faint);
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      .ba-foot b {
        color: var(--ink);
      }

      .ba-main {
        flex: 1;
        min-width: 0;
      }
      .ba-frame {
        width: 100%;
        height: 100%;
        border: 0;
        background: #fff;
      }
      @media (max-width: 720px) {
        .ba-shell {
          flex-direction: column;
          height: auto;
          min-height: 100vh;
        }
        .ba-side {
          width: 100%;
          min-width: 0;
          border-right: 0;
          border-bottom: 1px solid var(--rule);
        }
        .ba-list {
          max-height: 260px;
        }
        .ba-frame {
          height: 80vh;
        }
      }
    </style>
  </head>
  <body>
    <div class="ba-shell">
      <aside class="ba-side">
        <div class="ba-head">
          <div class="ba-head-top">
            <h1><span>Bet</span> Analyzer</h1>
            <a class="ba-home" href="index.html">← Home</a>
          </div>
          <p>Saved reports (this browser)</p>
        </div>
        <div class="ba-stats" id="ba-stats"></div>
        <div class="ba-list" id="ba-list"></div>
        <div class="ba-foot">
          <span>Stored on this device</span>
          <span id="ba-foot-count"></span>
        </div>
      </aside>
      <main class="ba-main">
        <iframe class="ba-frame" id="ba-frame" title="Report"></iframe>
      </main>
    </div>
    <script src="./dashboard-app.js"></script>
  </body>
</html>
