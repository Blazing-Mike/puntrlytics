<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Bet Analyzer — Dashboard</title>
    <style>
      :root {
        --bg: #0b0f17;
        --panel: #111827;
        --rule: #374153;
        --ink: #f2eee4;
        --faint: #9aa4b6;
        --gold: #f7b955;
        --lime: #41d484;
        --rose: #ff7084;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          14px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      .ba-shell {
        display: flex;
        height: 100vh;
      }
      .ba-side {
        width: 300px;
        min-width: 300px;
        border-right: 1px solid var(--rule);
        background: var(--panel);
        display: flex;
        flex-direction: column;
      }
      .ba-head {
        padding: 18px;
        border-bottom: 1px solid var(--rule);
      }
      .ba-head-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .ba-home {
        font: 700 10px/1.6 "Courier New", Courier, monospace;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        color: var(--gold);
        text-decoration: none;
        white-space: nowrap;
      }
      .ba-home:hover {
        text-decoration: underline;
      }
      .ba-home:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 2px;
      }
      .ba-head h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 0.5px;
      }
      .ba-head h1 span {
        color: var(--gold);
      }
      .ba-head p {
        margin: 4px 0 0;
        font: 700 10px/1.6 "Courier New", Courier, monospace;
        text-transform: uppercase;
        letter-spacing: 1.4px;
        color: var(--faint);
      }
      .ba-list {
        flex: 1;
        overflow-y: auto;
        padding: 10px;
      }
      .ba-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 2px 10px;
        width: 100%;
        text-align: left;
        background: transparent;
        border: 1px solid transparent;
        border-radius: 8px;
        padding: 10px 12px;
        margin-bottom: 6px;
        cursor: pointer;
        color: var(--ink);
        transition:
          background 0.12s ease,
          border-color 0.12s ease;
      }
      .ba-row:hover {
        background: rgba(255, 255, 255, 0.04);
      }
      .ba-row.ba-active {
        border-color: var(--gold);
        background: rgba(247, 185, 85, 0.08);
      }
      .ba-row-prov {
        font-weight: 700;
        font-size: 13px;
      }
      .ba-row-date {
        font-size: 11px;
        color: var(--faint);
      }
      .ba-row-profit {
        justify-self: end;
        font-weight: 700;
        font-size: 13px;
      }
      .ba-row-roi {
        justify-self: end;
        font-size: 12px;
        color: var(--faint);
      }
      .ba-pos {
        color: var(--lime);
      }
      .ba-neg {
        color: var(--rose);
      }
      .ba-empty {
        color: var(--faint);
        font-size: 13px;
        padding: 20px 12px;
        text-align: center;
      }
      .ba-main {
        flex: 1;
        min-width: 0;
      }
      .ba-frame {
        width: 100%;
        height: 100%;
        border: 0;
        background: #fff;
      }
      @media (max-width: 720px) {
        .ba-shell {
          flex-direction: column;
          height: auto;
          min-height: 100vh;
        }
        .ba-side {
          width: 100%;
          min-width: 0;
          border-right: 0;
          border-bottom: 1px solid var(--rule);
        }
        .ba-list {
          max-height: 240px;
        }
        .ba-frame {
          height: 80vh;
        }
      }
    </style>
  </head>
  <body>
    <div class="ba-shell">
      <aside class="ba-side">
        <div class="ba-head">
          <div class="ba-head-top">
            <h1><span>Bet</span> Analyzer</h1>
            <a class="ba-home" href="index.html">← Home</a>
          </div>
          <p>Saved reports (this browser)</p>
        </div>
        <div class="ba-list" id="ba-list"></div>
      </aside>
      <main class="ba-main">
        <iframe class="ba-frame" id="ba-frame" title="Report"></iframe>
      </main>
    </div>
    <script src="./dashboard-app.js"></script>
  </body>
</html>
